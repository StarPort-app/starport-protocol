name: Verify public protocol
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:contracts
      - run: npm run verify:governance
      - run: npm run verify:canonical
      - run: npm run demo:rwa-pipeline
      - run: npm run sim:node
      - run: npm run sim:bot
      - run: npm run example:offline
